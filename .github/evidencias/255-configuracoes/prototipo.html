<div class="layout"><aside class="sidebar" id="sidebar"><img class="foliage" src="__FOLIAGE__" alt=""><div class="brand"><img src="__LOGO__" alt=""><b><span>Green</span>ER</b></div><nav aria-label="Navegação principal"><div class="group">ACOMPANHAMENTO</div><button data-outside="Dashboard">Dashboard</button><button data-outside="Aplicações">Aplicações</button><div class="group">ANÁLISES</div><button data-outside="Ranking">Ranking</button><button data-outside="Comparação">Comparação</button><button data-outside="Simulação regional">Simulação regional</button><div class="group">SISTEMA</div><button data-outside="Metodologia e minhas preferências">Metodologia</button><button class="active" id="settings-nav" aria-current="page">Configurações</button></nav><div class="bottom"><small>PREFERÊNCIAS</small><p>Português · Brasil</p><button id="theme-toggle">Alternar tema</button><p><strong id="signed-name">Marina Alves</strong><br><small id="signed-role">Admin</small></p></div></aside><div><header class="topbar"><button id="menu" aria-controls="sidebar" aria-expanded="false">Menu</button><strong>GreenER</strong><small>PROTÓTIPO · DADOS ILUSTRATIVOS</small></header><main class="content" id="main" tabindex="-1"><div class="eyebrow">Sistema</div><h1>Configurações</h1><p class="muted" id="subtitle"></p><nav class="tabs" role="tablist" aria-label="Áreas das configurações" id="tabs"></nav><label class="mobile-area">Área das configurações<select id="area"></select></label><div id="announcement" role="status" aria-live="polite"></div><section id="panel" role="tabpanel" class="stack"></section></main></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s),e=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const labels={monitor:'Monitoramento',users:'Usuários',audit:'Auditoria',account:'Minha conta'};
let role='Admin',tab=new URLSearchParams(location.hash.slice(1)).get('area')||'monitor',state='ready',paused=false,search='',filterRole='',filterStatus='',size='10',page=1,sort='asc',filtersOpen=false,pendingAction=null,opener=null;
let users=[{id:'demo-camila',name:'Camila Souza',email:'camila@example.org',role:'Analista',status:'Ativa'},{id:'demo-marina',name:'Marina Alves',email:'marina@example.org',role:'Admin',status:'Ativa'},{id:'demo-paulo',name:'Paulo Santos',email:'paulo@example.org',role:'Visitante',status:'Bloqueada'}];
const audit=[{id:'audit-demo-01',at:'17/11/2026 · 14:20',actor:'Marina Alves',action:'Retomar monitoramento',result:'Sucesso',before:'Coleta pausada',after:'Coleta ativa',reason:'Manutenção concluída'},{id:'audit-demo-02',at:'17/11/2026 · 14:12',actor:'Marina Alves',action:'Alterar papel de conta',result:'Sucesso',before:'Visitante',after:'Analista',reason:'Atribuição de análise ambiental'}];
const badge=(s,w=false)=>`<span class="badge ${w?'warn':''}">${e(s)}</span>`;
const btn=(s,action,primary=false)=>`<button type="button" data-action="${action}" class="${primary?'primary':''}">${s}</button>`;
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const stat=(label,value,note)=>`<div class="card"><small>${label}</small><strong>${value}</strong><small>${note}</small></div>`;
function announce(message){$('#announcement').innerHTML=`<p class="notice">${e(message)}</p>`}
function navigate(next){tab=next;search='';page=1;filterRole='';filterStatus='';filtersOpen=false;history.replaceState({},'',`#area=${tab}`);render()}
function render(){
 if(role!=='Admin')tab='account';if(!labels[tab])tab='monitor';
 const areas=role==='Admin'?Object.keys(labels):['account'];
 $('#tabs').innerHTML=areas.map(t=>`<button id="tab-${t}" role="tab" aria-controls="panel" aria-selected="${tab===t}" tabindex="${tab===t?0:-1}" data-tab="${t}">${labels[t]}</button>`).join('');
 $('#area').innerHTML=areas.map(t=>`<option value="${t}" ${t===tab?'selected':''}>${labels[t]}</option>`).join('');
 $('#panel').setAttribute('aria-labelledby',`tab-${tab}`);$('#signed-name').textContent=role==='Admin'?'Marina Alves':'Camila Souza';$('#signed-role').textContent=role;
 $('#subtitle').textContent=role==='Admin'?'Acompanhe a operação e administre os acessos ao GreenER.':'Cuide da sua conta e personalize sua experiência.';
 const panel=$('#panel');
 if(state==='loading'){panel.innerHTML='<div class="card screen-message" role="status"><h2>Consultando informações…</h2><p class="muted">Aguarde a resposta antes de interpretar o estado.</p></div><div class="skeleton" aria-hidden="true"></div>';return}
 if(state==='denied'||state==='session'){panel.innerHTML=`<div class="card screen-message"><h2>${state==='session'?'Sua sessão expirou':'Acesso restrito a Admin'}</h2><p class="muted">${state==='session'?'Entre novamente para continuar.':'Você pode consultar sua conta e as páginas públicas.'}</p>${btn(state==='session'?'Voltar ao login':'Ir para minha conta','recover')}</div>`;return}
 if(state==='error'){panel.innerHTML=`<div class="card screen-message" role="alert"><h2>Não foi possível atualizar</h2><p class="muted">O contexto da consulta foi preservado. Tente novamente.</p>${btn('Tentar novamente','retry',true)}</div>`;return}
 let content=tab==='monitor'?monitor():tab==='users'?accounts():tab==='audit'?audits():account();
 panel.innerHTML=(state==='partial'?'<div class="notice warn" role="status">Diagnóstico parcial · a fonte de carbono apresentou falha. Os dados conhecidos continuam identificados.</div>':'')+content;
 const input=$('#search');if(input)input.value=search;
}
function monitor(){return `<div class="operation-head"><div><h2 class="operation-state">${paused?'Coleta pausada':'Coleta ativa'}</h2><p class="muted">${paused?'Novos ciclos suspensos. O histórico mantém as lacunas do período de pausa.':'Consultas automáticas a cada 60 segundos · último ciclo às 14:32'}</p></div>${btn(paused?'Retomar coleta':'Pausar coleta','pause',true)}</div><div class="operation-facts"><span>24 aplicações conhecidas</span><span class="warning-text">2 com dados desatualizados</span><span class="muted">Última observação · 14:31:48</span></div><section class="flat-section"><div class="row between"><div><h2>Integrações</h2><p class="muted">Diagnóstico consultado em 17/11/2026, às 14:33 · UTC−03:00</p></div>${btn('Atualizar diagnóstico','refresh')}</div><div class="source-list"><div class="source-row"><strong>Agregador de Métricas</strong><span class="ok-text">Consulta bem-sucedida</span><span class="muted">Último sucesso às 14:32</span></div><div class="source-row"><strong>Intensidade de Carbono</strong><span class="warning-text">Com falhas · 2 incidentes</span><span class="muted">Último sucesso às 14:25</span></div></div></section><section class="flat-section"><h2>Ciclos recentes</h2><p class="muted">O resultado de cada execução permanece registrado.</p>${state==='empty'?'<div class="screen-message"><h3>Nenhum ciclo registrado</h3><p>A ausência de diagnóstico não significa que as fontes estejam saudáveis.</p></div>':`<div class="table-wrap"><table><thead><tr><th>Início · UTC−03:00</th><th>Resultado</th><th>Processadas</th><th>Falhas</th><th>Ações</th></tr></thead><tbody><tr><td>17/11/2026 · 14:32</td><td><span class="warning-text">Parcial</span></td><td>24</td><td>2</td><td>${btn('Ver ciclo','cycle')}</td></tr></tbody></table></div>`}</section><small>Atualizar o diagnóstico não inicia coleta. O intervalo é configurado no ambiente.</small>`}
function filterBar(){return `<div class="row"><input class="search" id="search" type="search" aria-label="Buscar em todas as colunas" placeholder="Buscar por nome, e-mail, papel, estado ou identificador">${btn('Filtros de colunas','filters')}${btn('Limpar filtros','clear')}</div>${filtersOpen?`<div class="filters"><label>Papel<select id="filter-role"><option value="">Todos</option>${['Admin','Analista','Visitante'].map(r=>`<option ${filterRole===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Estado<select id="filter-status"><option value="">Todos</option>${['Ativa','Bloqueada','Desativada'].map(r=>`<option ${filterStatus===r?'selected':''}>${r}</option>`).join('')}</select></label></div>`:''}`}
function filtered(){return users.filter(u=>normalize([u.name,u.email,u.role,u.status].join(' ')).includes(normalize(search))&&(!filterRole||u.role===filterRole)&&(!filterStatus||u.status===filterStatus)).sort((a,b)=>(sort==='asc'?1:-1)*a.name.localeCompare(b.name,'pt-BR')||a.id.localeCompare(b.id))}
function accounts(){const all=state==='empty'?[]:filtered(),n=size==='all'?Math.max(all.length,1):Number(size),pages=Math.max(1,Math.ceil(all.length/n));page=Math.min(page,pages);const rows=all.slice((page-1)*n,page*n);return `<div class="row between"><div><h2>Usuários e acessos</h2><p class="muted">Contas da organização · alterações confirmadas pelo servidor.</p></div>${btn('Criar conta','create',true)}</div>${filterBar()}<div class="table-wrap"><table><thead><tr><th aria-sort="${sort==='asc'?'ascending':'descending'}">${btn('Nome '+(sort==='asc'?'↑':'↓'),'sort')}</th><th>E-mail</th><th>Papel</th><th>Estado</th><th>Ações</th></tr></thead><tbody>${rows.length?rows.map(u=>`<tr><td>${e(u.name)}</td><td>${e(u.email)}</td><td>${e(u.role)}</td><td>${badge(u.status,u.status!=='Ativa')}</td><td>${btn('Gerenciar '+e(u.name),'manage:'+u.id)}</td></tr>`).join(''):`<tr><td colspan="5"><h3>${users.length&&state!=='empty'?'Nenhum resultado para os filtros':'Nenhuma conta disponível'}</h3><p class="muted">${users.length&&state!=='empty'?'Limpe os filtros para consultar as demais contas.':'Não há contas no conjunto consultado.'}</p></td></tr>`}</tbody></table><div class="pagination"><span class="count">${all.length?`${(page-1)*n+1}–${Math.min(page*n,all.length)} de ${all.length}`:'0 resultados'}</span><label>Itens por página<select id="size" aria-label="Itens por página">${['5','10','15','20','all'].map(v=>`<option value="${v}" ${size===v?'selected':''}>${v==='all'?'Todos':v}</option>`).join('')}</select></label><button data-action="prev" ${page===1?'disabled':''}>Anterior</button><span aria-current="page">${page}</span><button data-action="next" ${page===pages?'disabled':''}>Próxima</button></div></div><p class="notice">Mudanças de papel, bloqueio e desativação exigem confirmação e motivo. O histórico e a autoria são preservados.</p>`}
function audits(){return `<div><h2>Auditoria da organização</h2><p class="muted">Quem realizou a ação, o motivo e o resultado registrado.</p></div>${state==='empty'?'<div class="card"><h3>Nenhum evento registrado</h3><p>Não há eventos no recorte consultado.</p></div>':`<div class="table-wrap"><table><thead><tr><th>Instante ↓ · UTC−03:00</th><th>Responsável</th><th>Operação</th><th>Resultado</th><th>Detalhes</th></tr></thead><tbody>${audit.map(a=>`<tr><td>${a.at}</td><td>${a.actor}</td><td>${a.action}</td><td>${badge(a.result)}</td><td>${btn('Abrir evento','audit:'+a.id)}</td></tr>`).join('')}</tbody></table><div class="pagination">1–2 de 2 eventos · 10 itens por página</div></div>`}`}
function account(){return `<div><h2>Minha conta</h2><p class="muted">Dados de acesso e preferências de apresentação.</p></div><section class="account-section"><div><h3>Dados da conta</h3><p class="muted">Informações do seu acesso</p></div><dl class="details"><div><dt>Nome</dt><dd>${role==='Admin'?'Marina Alves':'Camila Souza'}</dd></div><div><dt>Papel</dt><dd>${role}</dd></div><div><dt>E-mail</dt><dd>${role==='Admin'?'marina':'camila'}@example.org</dd></div><div><dt>Método de acesso</dt><dd>Senha${role==='Admin'?' e autenticador':''}</dd></div></dl></section><section class="account-section"><div><h3>Aparência e idioma</h3><p class="muted">Preferências desta interface</p></div><div class="account-fields"><label>Tema<select id="theme"><option value="light">Claro</option><option value="dark" ${document.documentElement.dataset.theme==='dark'?'selected':''}>Escuro</option><option value="system">Sistema</option></select></label><label>Idioma<select id="language"><option>Português · Brasil</option><option>English · United States</option></select></label><small>A troca de idioma é ilustrativa neste protótipo.</small></div></section><section class="account-section"><div><h3>Preferências das análises</h3></div><div><p class="muted">Limites de energia, CO₂e, cobertura e padrões de análise continuam em Metodologia e minhas preferências.</p><p>${btn('Abrir metodologia e minhas preferências','methodology')}</p></div></section><div class="row between"><span class="muted">Acesso ativo · senhas e códigos não são exibidos.</span>${btn('Sair da conta','logout')}</div>`}
function openDialog(title,body,confirm,action){opener=document.activeElement;pendingAction=action;$('#dialog-title').textContent=title;$('#dialog-content').innerHTML=body;$('#confirm').textContent=confirm;$('#dialog-error').hidden=true;$('#dialog').showModal();$('#cancel').focus()}
function closeDialog(){ $('#dialog').close();opener?.focus();pendingAction=null }
function reason(){return '<label>Motivo obrigatório<textarea name="reason" required maxlength="512" placeholder="Explique por que esta alteração é necessária"></textarea></label><label><input name="fail" type="checkbox"> Simular falha do servidor nesta demonstração</label>'}
function action(a){
 if(a==='retry'||a==='recover'){state='ready';$('#state').value='ready';if(a==='recover')tab='account';render();return}
 if(a==='refresh'){announce('Diagnóstico atualizado nesta demonstração. Nenhuma coleta foi iniciada.');return}
 if(a==='pause'){openDialog(paused?'Retomar coleta do GreenER?':'Pausar coleta do GreenER?',`<p class="muted">${paused?'Novos ciclos voltam a ser agendados. As lacunas do período de pausa permanecem no histórico.':'Novos ciclos serão suspensos. Um ciclo já iniciado pode concluir. As aplicações monitoradas continuam funcionando; a pausa pode criar lacunas no histórico.'}</p>${reason()}`,paused?'Confirmar retomada':'Confirmar pausa',{kind:'pause'});return}
 if(a==='create'){openDialog('Criar conta','<p class="muted">A conta fica pendente de confirmação. O titular define a própria senha pelo fluxo de ativação.</p><label>Nome<input name="name" required maxlength="120"></label><label>E-mail<input type="email" name="email" required></label><label>Papel<select name="role"><option>Visitante</option><option>Analista</option><option>Admin</option></select></label>','Criar conta',{kind:'create'});return}
 if(a.startsWith('manage:')){const u=users.find(u=>u.id===a.slice(7));openDialog('Gerenciar '+u.name,`<p class="muted">${e(u.email)} · papel atual: ${u.role} · estado: ${u.status}</p><label>Operação<select name="operation"><option value="role">Alterar papel</option><option value="Bloqueada">Bloquear acesso</option><option value="Ativa">Reativar acesso</option><option value="Desativada">Desativar acesso</option></select></label><label>Novo papel<select name="role">${['Visitante','Analista','Admin'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></label><p class="muted">Bloqueio, desativação e mudança de papel revogam sessões. Reativação exige novo login. A autoria permanece registrada.</p>${reason()}`,'Revisar alteração',{kind:'review-user',id:u.id});return}
 if(a.startsWith('audit:')){const v=audit.find(v=>v.id===a.slice(6));openDialog('Detalhe do evento',`<dl class="details"><div><dt>Antes</dt><dd>${v.before}</dd></div><div><dt>Depois</dt><dd>${v.after}</dd></div><div><dt>Responsável</dt><dd>${v.actor}</dd></div><div><dt>Instante · UTC−03:00</dt><dd>${v.at}</dd></div></dl><p>Motivo: ${v.reason}</p><p class="muted">Evento ${v.id} · ${v.result}</p>`,'Fechar',{kind:'close'});return}
 if(a==='cycle'){openDialog('Ciclo ilustrativo · 14:32','<p>Resultado parcial · 24 aplicações processadas · 2 falhas.</p><p class="muted">A falha no fator de carbono não equivale a emissão zero. Duração e horários pertencem à execução registrada.</p>','Fechar',{kind:'close'});return}
 if(a==='filters'){filtersOpen=!filtersOpen;render();return}
 if(a==='clear'){search='';filterRole='';filterStatus='';page=1;render();return}
 if(a==='sort'){sort=sort==='asc'?'desc':'asc';page=1;render();return}
 if(a==='prev'||a==='next'){page+=a==='prev'?-1:1;render();return}
 if(a==='methodology'){openDialog('Metodologia e minhas preferências','<p>A tela existente é preservada: energia, emissões, cobertura e padrões de análise.</p><p class="muted">Na implementação, este acesso abre a rota existente; os formulários não serão duplicados em Configurações.</p>','Voltar',{kind:'close'});return}
 if(a==='logout'){openDialog('Sair da conta?','<p>Você poderá continuar consultando as páginas públicas.</p>','Sair',{kind:'logout'});return}
}
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-action]'),t=ev.target.closest('[data-tab]'),o=ev.target.closest('[data-outside]');if(a)action(a.dataset.action);if(t)navigate(t.dataset.tab);if(o){openDialog(o.dataset.outside,'<p>Esta página existente está fora da navegação demonstrada pelo protótipo de Configurações.</p>','Voltar',{kind:'close'})}});
$('#tabs').addEventListener('keydown',ev=>{const buttons=[...$('#tabs').querySelectorAll('button')],i=buttons.indexOf(document.activeElement);let next;if(ev.key==='ArrowRight')next=(i+1)%buttons.length;if(ev.key==='ArrowLeft')next=(i+buttons.length-1)%buttons.length;if(ev.key==='Home')next=0;if(ev.key==='End')next=buttons.length-1;if(next!==undefined){ev.preventDefault();navigate(buttons[next].dataset.tab);$('#tab-'+tab).focus()}});
document.addEventListener('change',ev=>{const {id,value}=ev.target;if(id==='role'){role=value;state='ready';$('#state').value='ready';$('#announcement').innerHTML='';render()}if(id==='area')navigate(value);if(id==='state'){state=value;render()}if(id==='size'){size=value;page=1;render()}if(id==='filter-role'){filterRole=value;page=1;render()}if(id==='filter-status'){filterStatus=value;page=1;render()}if(id==='theme'){document.documentElement.dataset.theme=value==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):value}if(id==='language')announce('Idioma selecionado na demonstração; tradução completa pertence à implementação.')});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){search=ev.target.value;const pos=ev.target.selectionStart;page=1;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
$('#cancel').onclick=closeDialog;$('#dialog').addEventListener('cancel',ev=>{ev.preventDefault();closeDialog()});
$('#dialog-form').onsubmit=ev=>{ev.preventDefault();const form=new FormData(ev.target),a=pendingAction;if(!a)return;
 if(form.get('fail')){$('#dialog-error').textContent='Não foi possível concluir. Nenhuma alteração foi aplicada. Seu motivo foi preservado; desmarque a falha para tentar novamente.';$('#dialog-error').hidden=false;return}
 if(a.kind==='pause'){paused=!paused;closeDialog();render();announce(paused?'Coleta pausada. A ação foi registrada.':'Coleta retomada. As lacunas históricas permanecem.');$('#panel [data-action=pause]').focus();return}
 if(a.kind==='create'){users.push({id:'demo-'+users.length,name:String(form.get('name')),email:String(form.get('email')),role:String(form.get('role')),status:'Pendente'});closeDialog();render();announce('Conta criada na demonstração. Pendente de confirmação; nenhum e-mail foi enviado.');return}
 if(a.kind==='review-user'){const u=users.find(u=>u.id===a.id);if(u.email==='marina@example.org'){$('#dialog-error').textContent='Não é permitido alterar o próprio acesso nesta demonstração. O servidor também deve preservar o último Admin ativo.';$('#dialog-error').hidden=false;return}pendingAction={kind:'apply-user',id:a.id,operation:String(form.get('operation')),role:String(form.get('role')),reason:String(form.get('reason'))};$('#dialog-title').textContent='Confirmar alteração de acesso?';$('#dialog-content').innerHTML=`<p>${e(u.name)} · ${e(pendingAction.operation==='role'?'Papel: '+u.role+' → '+pendingAction.role:'Estado: '+u.status+' → '+pendingAction.operation)}</p><p>Motivo: ${e(pendingAction.reason)}</p><p class="muted">A lista muda somente após sucesso. Histórico e autoria serão preservados.</p>`;$('#confirm').textContent='Confirmar alteração';$('#cancel').focus();return}
 if(a.kind==='apply-user'){const u=users.find(u=>u.id===a.id);if(a.operation==='role')u.role=a.role;else u.status=a.operation;closeDialog();render();announce('Acesso atualizado na demonstração. O histórico da conta foi preservado.');return}
 if(a.kind==='logout'){closeDialog();state='session';$('#state').value='session';render();return}closeDialog();};
$('#theme-toggle').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};
$('#menu').onclick=()=>{const open=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open));if(open)$('#sidebar nav button').focus()};
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#sidebar').classList.contains('open')){$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#menu').focus()}});
$('#settings-nav').onclick=()=>{$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#main').focus()};
document.body.prepend(document.querySelector('.toolbar'));
render();
</script></html>
