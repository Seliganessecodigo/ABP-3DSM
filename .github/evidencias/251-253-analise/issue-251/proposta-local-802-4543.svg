<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="429" viewBox="0 0 560 429"><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="560" height="429" rx="16" fill="#ffffff" stroke="none"/><text fill="#17332d" font-size="22" font-weight="700"><tspan x="24" y="46">Ordenação</tspan></text><text fill="#64716d" font-size="22" font-weight="400"><tspan x="518" y="46">×</tspan></text><text fill="#64716d" font-size="13" font-weight="400"><tspan x="24" y="78">Uma coluna ativa por vez. Ausentes ficam ao final nas duas direções.</tspan></text><text fill="#64716d" font-size="10" font-weight="700"><tspan x="24" y="111">COLUNA</tspan></text><rect x="24" y="123" width="512" height="44" rx="8" fill="#ffffff" stroke="#788c82"/><text fill="#17332d" font-size="13" font-weight="400"><tspan x="36" y="147">CO₂e estimado (kg)</tspan></text><text fill="#64716d" font-size="14" font-weight="400"><tspan x="511" y="148">⌄</tspan></text><rect x="24" y="183" width="512" height="44" rx="8" fill="#ffffff" stroke="#788c82"/><text fill="#106c55" font-size="13" font-weight="650"><tspan x="36" y="207">Crescente</tspan></text><rect x="24" y="237" width="512" height="44" rx="8" fill="#ffffff" stroke="#788c82"/><text fill="#106c55" font-size="13" font-weight="650"><tspan x="36" y="261">Decrescente ✓</tspan></text><text fill="#64716d" font-size="13" font-weight="400"><tspan x="24" y="304">Colunas de texto: comparação por locale. Números: valor numérico. Empates têm a</tspan><tspan x="24" y="324">mesma classificação.</tspan></text><rect x="24" y="361" width="250" height="44" rx="8" fill="#ffffff" stroke="#788c82"/><text fill="#106c55" font-size="13" font-weight="650"><tspan x="36" y="385">Cancelar</tspan></text><rect x="286" y="361" width="250" height="44" rx="8" fill="#106c55" stroke="none"/><text fill="#ffffff" font-size="13" font-weight="650"><tspan x="298" y="385">Confirmar</tspan></text></g></svg>