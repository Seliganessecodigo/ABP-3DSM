<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GreenER — Em qualquer tela</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dde4df;font-family:'Segoe UI',Arial,sans-serif;color:#16372c}#viewport{position:relative;width:1920px;height:1080px;overflow:hidden;background:#082e24;perspective:2400px;perspective-origin:50% 50%}#cube{position:absolute;width:1920px;height:1080px;transform-style:preserve-3d}canvas.face{position:absolute;inset:0;width:1920px;height:1080px;backface-visibility:hidden}#front{transform:translateZ(960px)}#right{transform:rotateY(90deg) translateZ(960px)}#shade{pointer-events:none;position:absolute;inset:0;background:linear-gradient(90deg,#001a1424,transparent 55%,#001a1415);opacity:0}#disclosure{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:17px;letter-spacing:.5px;color:#81968d;pointer-events:none}nav{display:flex;flex-wrap:wrap;align-items:center;gap:20px;width:100%;max-width:1100px;margin:20px auto;padding:0 20px}button{font:inherit;border:0;border-radius:30px;background:#076349;color:white;padding:12px 24px;cursor:pointer}input{flex:1;min-width:100px;accent-color:#076349}.preview #viewport{transform-origin:top left}.preview #wrap{overflow:hidden;margin:auto}.render nav{display:none}
</style>
<div id="wrap"><div id="viewport"><div id="cube"><canvas class="face" id="front" width="1920" height="1080"></canvas><canvas class="face" id="right" width="1920" height="1080"></canvas></div><div id="shade"></div><div id="disclosure">Interface real · Dados ilustrativos</div></div></div>
<nav aria-label="Controles da prévia"><button id="play">Reproduzir</button><input id="seek" type="range" min="0" max="26" value="0" step="0.01" aria-label="Posição no vídeo"><span id="time">0:00 / 0:26</span></nav>
<audio id="audio" src="output/soundtrack.wav" preload="none"></audio>
<script>
const W=1920,H=1080,duration=26,starts=[0,4.4,8.1,11.8,15.5,19.2,22.4];
window.transitionTimes=starts.slice(1).map(t=>t-.55);
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;
const contexts=[document.querySelector('#front').getContext('2d'),document.querySelector('#right').getContext('2d')];
const images={};const names=['desktop-catalog-light','desktop-detail-light','mobile-catalog-light','mobile-detail-light','desktop-catalog-dark','mobile-catalog-dark','green-er-mark'];
function text(c,value,x,y,size=72,color='#13382b',weight=600,align='left'){c.font=`${weight} ${size}px "Segoe UI",Arial,sans-serif`;c.fillStyle=color;c.textAlign=align;c.textBaseline='middle';c.fillText(value,x,y)}
function round(c,x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill()}
function screen(c,img,x,y,w,h,scroll=0){c.save();c.beginPath();c.roundRect(x,y,w,h,10);c.clip();const scale=w/img.width;const available=Math.max(0,img.height-h/scale);c.drawImage(img,0,Math.min(available,scroll),img.width,h/scale,x,y,w,h);c.restore()}
function laptop(c,img,cx,cy,width,scroll=0){
 const sw=width*.92,sh=sw/1.6,x=cx-sw/2,y=cy-sh/2;
 c.save();c.shadowColor='#001b2a26';c.shadowBlur=45;c.shadowOffsetY=28;round(c,x-14,y-17,sw+28,sh+40,22,'#202723');c.restore();
 screen(c,img,x,y,sw,sh,scroll);c.fillStyle='#67736c';c.beginPath();c.arc(cx,y-8,2.4,0,Math.PI*2);c.fill();
 const grad=c.createLinearGradient(0,y+sh+20,0,y+sh+53);grad.addColorStop(0,'#e8ece9');grad.addColorStop(.5,'#aeb9b2');grad.addColorStop(1,'#74837a');c.fillStyle=grad;
 c.beginPath();c.moveTo(x-15,y+sh+22);c.lineTo(x+sw+15,y+sh+22);c.lineTo(cx+width/2,y+sh+44);c.quadraticCurveTo(cx+width/2,y+sh+52,cx+width/2-30,y+sh+52);c.lineTo(cx-width/2+30,y+sh+52);c.quadraticCurveTo(cx-width/2,y+sh+52,cx-width/2,y+sh+44);c.closePath();c.fill();round(c,cx-65,y+sh+22,130,6,3,'#8f9d94');
}
function phone(c,img,cx,cy,height,scroll=0){
 const w=height*390/844,x=cx-w/2,y=cy-height/2;
 c.save();c.shadowColor='#001b2a40';c.shadowBlur=50;c.shadowOffsetY=25;round(c,x-11,y-13,w+22,height+26,48,'#232d27');c.restore();
 c.save();c.beginPath();c.roundRect(x,y,w,height,38);c.clip();screen(c,img,x,y,w,height,scroll);c.restore();
 c.fillStyle='#80948a';c.beginPath();c.arc(cx,y-6,2.5,0,Math.PI*2);c.fill();round(c,cx-48,y+height-14,96,4,2,'#95aaa0');round(c,x-14,y+120,3,60,1,'#82958a');
}
function label(c,index,dark){text(c,'GreenER',110,75,30,dark?'#e9fff2':'#075b40',650);text(c,index===6?'EM QUALQUER TELA':'app-pagamentos',1810,75,21,dark?'#99bdaa':'#769084',500,'right')}
function paint(c,index,local){
 const dark=index>=3&&index<6,p=smooth(local/3.2),fg=dark?'#f1fff6':'#143a2b';
 c.globalAlpha=1;c.fillStyle=dark?(index===4?'#101c17':'#073e2c'):'#f7faf6';c.fillRect(0,0,W,H);
 const gradient=c.createRadialGradient(1000,460,60,1000,460,1250);gradient.addColorStop(0,dark?'#ffffff08':'#ffffff');gradient.addColorStop(1,'#ffffff00');c.fillStyle=gradient;c.fillRect(0,0,W,H);label(c,index,dark);
 if(index===0||index===2||index===4){
   const title=['Encontre. Acompanhe.','','Cada detalhe importa.','','Clareza, em qualquer modo.'][index];text(c,title,960,170,66,fg,600,'center');
   c.save();c.translate(960,615);const s=1+.035*p;c.scale(s,s);c.translate(-960,-615);
   laptop(c,images[index===0?'desktop-catalog-light':index===2?'desktop-detail-light':'desktop-catalog-dark'],960,625,1340,index===2?130*p:30*p);c.restore();
 }else if(index===1||index===3||index===5){
   const lines=index===1?['A mesma visão.','Na sua mão.']:index===3?['Continue.','De onde estiver.']:['O formato muda.','O foco continua.'];
   lines.forEach((line,i)=>text(c,line,155,430+i*100,82,fg,600));text(c,index===1?'Do catálogo aos detalhes.':index===3?'Seu acompanhamento continua.':'Uma experiência. Em qualquer tela.',160,675,30,dark?'#a4c8b2':'#6e887a',400);
   c.save();c.translate(1350,570);c.rotate((-.02+.025*p));c.translate(-1350,-570);
   phone(c,images[index===1?'mobile-catalog-light':index===3?'mobile-detail-light':'mobile-catalog-dark'],1350,570,800,index===3?450*p:200*p);c.restore();
 }else{
   const alpha=smooth(local/.7);c.globalAlpha=alpha;
   c.save();c.globalCompositeOperation='multiply';c.drawImage(images['green-er-mark'],910,140,100,104);c.restore();
   text(c,'A visão completa. Em qualquer tela.',960,335,70,'#143a2b',600,'center');
   laptop(c,images['desktop-catalog-light'],790,675,970);phone(c,images['mobile-catalog-light'],1410,680,530);
   text(c,'Keep track. Keep it GreenER.',960,1040,30,'#456754',400,'center');
 }
}
window.draw=t=>{
 t=Math.max(0,Math.min(duration,t));let index=0;while(index<starts.length-1&&t>=starts[index+1])index++;
 const next=starts[index+1],transition=next!==undefined&&t>=next-1.1,p=transition?smooth((t-(next-1.1))/1.1):0;
 paint(contexts[0],index,t-starts[index]);paint(contexts[1],Math.min(index+1,6),Math.max(0,t-(next??26)));
 const retreat=200*Math.sin(p*Math.PI),roll=-.8*Math.sin(p*Math.PI);
 document.querySelector('#cube').style.transform=`translateZ(${-960-retreat}px) rotateZ(${roll}deg) rotateY(${-90*p}deg)`;
 document.querySelector('#shade').style.opacity=.4*Math.sin(p*Math.PI);document.querySelector('#disclosure').style.opacity=index===6?0:.8;
 window.frameState={index,transition,rotation:-90*p};return window.frameState;
};
window.ready=Promise.all(names.map(name=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{images[name]=img;resolve()};img.onerror=reject;img.src=`assets/${name}.png`}))).then(()=>document.fonts.ready).then(()=>window.draw(0));
const rendering=new URLSearchParams(location.search).has('render');document.body.className=rendering?'render':'preview';
function resize(){if(rendering)return;const scale=Math.min(innerWidth/1920,.72);document.querySelector('#viewport').style.transform=`scale(${scale})`;document.querySelector('#wrap').style.width=`${1920*scale}px`;document.querySelector('#wrap').style.height=`${1080*scale}px`}resize();addEventListener('resize',resize);
const play=document.querySelector('#play'),seek=document.querySelector('#seek'),audio=document.querySelector('#audio');let running=false,position=0,start=0;
function update(){window.draw(position);seek.value=position;document.querySelector('#time').textContent=`0:${String(Math.floor(position)).padStart(2,'0')} / 0:26`}
function tick(now){if(!running)return;position=Math.min(26,(now-start)/1000);update();if(position>=26){running=false;play.textContent='Reproduzir';audio.pause()}else requestAnimationFrame(tick)}
play.onclick=async()=>{await window.ready;running=!running;play.textContent=running?'Pausar':'Reproduzir';if(running){if(position>=26)position=0;start=performance.now()-position*1000;audio.currentTime=position;audio.play().catch(()=>{});requestAnimationFrame(tick)}else audio.pause()};seek.oninput=()=>{position=Number(seek.value);start=performance.now()-position*1000;update();if(audio.readyState)audio.currentTime=position};
</script>
</html>
