services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-3000}}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-greener}:${POSTGRES_PASSWORD:-greener_dev_only}@postgres:5432/${POSTGRES_DB:-greener}?schema=public
      METRICS_AGGREGATOR_URL: ${METRICS_AGGREGATOR_URL:-https://metrics.unilaunch.org}
      CARBON_INTENSITY_URL: ${CARBON_INTENSITY_URL:-https://carbon.unilaunch.org}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./backend:/app/backend
      - backend_node_modules:/app/backend/node_modules
    command: ["sh", "-c", "npm run migration:run --if-present && (npm run applications:discover || echo 'Initial catalog discovery failed; API will start without the initial catalog') && npm run start:dev"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greener}
      POSTGRES_USER: ${POSTGRES_USER:-greener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greener_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  backend_node_modules:
  frontend_node_modules:
  postgres_data:
